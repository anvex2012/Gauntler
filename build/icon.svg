<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3039"/>
      <stop offset="1" stop-color="#0c0e11"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7aa9ff"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".06"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".46" r=".42">
      <stop offset="0" stop-color="#3b82f6" stop-opacity=".35"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".38"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity=".55"/>
    </filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>

  <!-- Tile (macOS grid: 824 px artwork on a 1024 canvas) -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#drop)"/>
  <g clip-path="url(#tile)">
    <circle cx="512" cy="480" r="360" fill="url(#glow)"/>
    <!-- Fine technical grid -->
    <g stroke="#ffffff" stroke-opacity=".035" stroke-width="2">
      <path d="M100 236H924M100 372H924M100 508H924M100 644H924M100 780H924"/>
      <path d="M236 100V924M372 100V924M508 100V924M644 100V924M780 100V924"/>
    </g>
  </g>
  <rect x="101" y="101" width="822" height="822" rx="185" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- Shield -->
  <g filter="url(#soft)">
    <path d="M512 236 L724 314 V494 C724 630 636 736 512 792 C388 736 300 630 300 494 V314 Z" fill="url(#shield)"/>
  </g>
  <path d="M512 236 L724 314 V494 C724 630 636 736 512 792 C388 736 300 630 300 494 V314 Z" fill="url(#gloss)"/>
  <path d="M512 236 L724 314 V494 C724 630 636 736 512 792 C388 736 300 630 300 494 V314 Z" fill="none" stroke="#ffffff" stroke-opacity=".28" stroke-width="4"/>

  <!-- Check -->
  <path d="M414 508 L486 578 L614 446" fill="none" stroke="#ffffff" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
